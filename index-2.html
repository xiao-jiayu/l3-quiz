<title>Book 3 L3 快問快答</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: one centered column, four levels from basic to exam difficulty; highlighter-yellow underline is the only flourish. */
:root {
  --bg: #F2F5FA;
  --surface: #FFFFFF;
  --ink: #14213D;
  --muted: #5B6783;
  --line: #D9E0EC;
  --accent: #2B59FF;
  --accent-ink: #FFFFFF;
  --tint: #E7EDFF;
  --mark: #FFE066;
  --good: #13795B;
  --good-bg: #DDF4EA;
  --bad: #B3261E;
  --bad-bg: #FBE3E1;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-en: "Fredoka", "Noto Sans TC", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1626; --surface: #18223A; --ink: #EAF0FF; --muted: #9AA7C7; --line: #2A3657;
    --accent: #7C9BFF; --accent-ink: #0F1626; --tint: #22305A; --mark: #6B5A10;
    --good: #5BD9A6; --good-bg: #12382C; --bad: #FF8A80; --bad-bg: #432024;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1626; --surface: #18223A; --ink: #EAF0FF; --muted: #9AA7C7; --line: #2A3657;
  --accent: #7C9BFF; --accent-ink: #0F1626; --tint: #22305A; --mark: #6B5A10;
  --good: #5BD9A6; --good-bg: #12382C; --bad: #FF8A80; --bad-bg: #432024;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6;
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
h1 { font-size: clamp(34px, 9vw, 48px); line-height: 1.15; margin: 4px 0 0; font-weight: 900; text-wrap: balance; }
h1 .mark { background: linear-gradient(transparent 62%, var(--mark) 62%); }
h2 { font-size: 20px; margin: 0; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
legend { padding: 0; font-weight: 700; font-size: 14px; margin-bottom: 8px; }
.seg { position: relative; display: flex; gap: 8px; flex-wrap: wrap; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 18px; cursor: pointer; font-weight: 500; background: var(--surface); font-variant-numeric: tabular-nums; }
.seg input:checked + label { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.seg input:focus-visible + label { outline: 3px solid var(--accent); outline-offset: 2px; }
.note { font-size: 13px; color: var(--muted); }
.lvs { position: relative; display: grid; gap: 8px; }
.lvs input { position: absolute; opacity: 0; pointer-events: none; }
.lvs label { display: grid; grid-template-columns: 1fr auto; column-gap: 12px; align-items: baseline; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 14px; cursor: pointer; background: var(--surface); }
.lvs label b { font-size: 17px; }
.lvs label span { grid-column: 1; font-size: 13px; color: var(--muted); }
.lvs label em { grid-column: 2; grid-row: 1 / span 2; font-style: normal; font-family: var(--font-en); font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lvs input:checked + label { border-color: var(--accent); background: var(--tint); }
.lvs input:focus-visible + label, .toggle input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.toggle { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.toggle input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 12px 22px; font-weight: 700; font-size: 17px; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn:disabled { opacity: .5; cursor: default; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.topbar b { color: var(--ink); }
.bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; }
.bar.time > i { background: var(--mark); transition: width .1s linear; }
.bar.time.low > i { background: var(--bad); }
.chip { align-self: flex-start; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.q { font-family: var(--font-en); font-size: clamp(19px, 5vw, 25px); line-height: 1.5; font-weight: 500; overflow-wrap: anywhere; white-space: pre-line; }
.q .blank { display: inline-block; min-width: 3ch; border-bottom: 3px solid var(--accent); margin: 0 2px; }
.hint { font-size: 15px; color: var(--muted); margin-top: -8px; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
.opt { text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px 16px; font-family: var(--font-en); font-size: 18px; display: flex; gap: 12px; align-items: baseline; min-width: 0; overflow-wrap: anywhere; }
.opt kbd { font-family: var(--font-body); font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; flex: none; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt.correct { border-color: var(--good); background: var(--good-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.spell { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.pattern { font-family: var(--font-en); font-size: 26px; letter-spacing: .2em; word-break: break-all; }
.spellrow { display: flex; gap: 10px; flex-wrap: wrap; min-width: 0; }
#spIn { flex: 1 1 180px; min-width: 0; font-family: var(--font-en); font-size: 24px; padding: 10px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); }
#spIn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
#spIn.ok { border-color: var(--good); background: var(--good-bg); }
#spIn.no { border-color: var(--bad); background: var(--bad-bg); }
.fb { border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.fb.ok { background: var(--good-bg); }
.fb.no { background: var(--bad-bg); }
.fb strong { font-size: 17px; }
.fb.ok strong { color: var(--good); }
.fb.no strong { color: var(--bad); }
.score { font-family: var(--font-en); font-size: clamp(56px, 16vw, 84px); line-height: 1; font-weight: 600; font-variant-numeric: tabular-nums; }
.score small { font-size: .4em; color: var(--muted); }
.sub { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .08em; margin-top: 6px; }
.cat { display: grid; grid-template-columns: 8.5em 1fr 3.2em; gap: 10px; align-items: center; font-size: 14px; font-variant-numeric: tabular-nums; }
.cat .bar { height: 10px; }
.cat .bar > i { background: var(--good); }
.cat .bar.weak > i { background: var(--bad); }
.wl { display: flex; flex-direction: column; gap: 10px; }
.wi { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.wi .qq { font-family: var(--font-en); font-size: 18px; overflow-wrap: anywhere; }
.wi .ans { font-size: 14px; }
.wi .ans b { color: var(--good); font-family: var(--font-en); font-size: 16px; }
.wi .ans s { color: var(--bad); }
#nick { width: 100%; font: inherit; font-size: 18px; padding: 10px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); }
#nick:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.nicklab { display: block; font-weight: 700; font-size: 14px; margin-bottom: 6px; }
textarea { width: 100%; min-height: 120px; font: inherit; font-size: 14px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
@media (prefers-reduced-motion: reduce) { .bar.time > i { transition: none; } }
</style>
<style>:root{color-scheme:light dark}[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<div class="wrap">
  <section id="start" class="wrap" style="gap:16px">
    <div>
      <div class="eyebrow">Book 3 · Lesson 3</div>
      <h1>第三課快問快答<br><span class="mark">四關由易到難</span></h1>
    </div>
    <div class="card">
      <p class="muted">從認單字開始，一關一關闖到段考難度。每題選一個答案，或把單字打出來，答完馬上告訴你為什麼。</p>
      <div id="nickBox" hidden>
        <label class="nicklab" for="nick">你的暱稱</label>
        <input id="nick" type="text" maxlength="20" autocomplete="off" placeholder="例如：小明（不用寫全名）">
      </div>
      <fieldset>
        <legend>選一關</legend>
        <div class="lvs" id="lvBox"></div>
      </fieldset>
      <fieldset>
        <legend>每一關出幾題？</legend>
        <div class="seg" id="countSeg">
          <input type="radio" name="count" id="n5" value="5"><label for="n5">5</label>
          <input type="radio" name="count" id="n10" value="10" checked><label for="n10">10</label>
          <input type="radio" name="count" id="n15" value="15"><label for="n15">15</label>
          <input type="radio" name="count" id="n20" value="20"><label for="n20">20</label>
          <input type="radio" name="count" id="n25" value="25"><label for="n25">25</label>
        </div>
        <p class="note" id="countNote" hidden></p>
      </fieldset>
      <label class="toggle"><input type="checkbox" id="shuffleOn" checked><span>隨機抽題（取消就照題庫順序）</span></label>
      <label class="toggle"><input type="checkbox" id="timerOn" checked><span>限時作答（選擇題 25 秒，拼寫 40 秒）</span></label>
      <div class="btns"><button class="btn" id="goBtn">開始</button></div>
    </div>
  </section>

  <section id="play" class="wrap" style="gap:16px" hidden>
    <div class="topbar">
      <span>第 <b id="pi">1</b> / <b id="pn">15</b> 題</span>
      <span>連對 <b id="streak">0</b> · 答對 <b id="sc">0</b></span>
    </div>
    <div class="bar" aria-hidden="true"><i id="prog"></i></div>
    <div class="bar time" id="timeBar" aria-hidden="true"><i id="timeFill" style="width:100%"></i></div>
    <div class="card">
      <span class="chip" id="chip"></span>
      <div class="q" id="qText" aria-live="polite"></div>
      <div class="hint" id="qHint"></div>
      <div class="opts" id="opts"></div>
      <div class="spell" id="spell" hidden>
        <div class="pattern" id="pattern" aria-label="字母提示"></div>
        <div class="spellrow">
          <input id="spIn" type="text" size="1" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="輸入英文單字">
          <button class="btn" id="spGo" type="button">送出</button>
        </div>
        <div class="btns"><button class="btn ghost" id="spSkip" type="button">不會，看答案</button></div>
      </div>
      <div class="fb" id="fb" hidden>
        <strong id="fbTitle"></strong>
        <p id="fbTip"></p>
        <div class="btns"><button class="btn" id="nextBtn" type="button">下一題</button></div>
      </div>
    </div>
  </section>

  <section id="result" class="wrap" style="gap:16px" hidden>
    <div class="card">
      <div class="eyebrow">這一輪的結果</div>
      <div class="score"><span id="rs">0</span><small> / <span id="rt">0</span></small></div>
      <p id="rmsg"></p>
      <p class="muted" id="sendMsg" hidden></p>
      <div class="btns"><button class="btn ghost" id="resendBtn" type="button" hidden>再傳一次</button></div>
      <div id="cats" style="display:flex;flex-direction:column;gap:8px"></div>
    </div>
    <div class="card" id="wrongCard">
      <h2>答錯的題目</h2>
      <div class="wl" id="wl"></div>
      <div class="btns">
        <button class="btn ghost" id="copyBtn" type="button">複製錯題清單</button>
      </div>
      <textarea id="copyArea" readonly hidden aria-label="錯題清單"></textarea>
    </div>
    <div class="btns">
      <button class="btn" id="retryBtn" type="button">練習答錯的題目</button>
      <button class="btn ghost" id="againBtn" type="button">回到選關</button>
    </div>
  </section>
</div>

{"n": 12, "c": "單字", "q": "We must follow the following tips to save our food when we see many ___ in the kitchen.", "a": "ants", "o": ["pools", "jars", "ants", "forests"], "t": "ants ＝ 螞蟻。廚房裡看到很多螞蟻，就要把食物收好。pool、forest 不會出現在廚房。", "lv": 4},
{"n": 13, "c": "單字", "q": "Most students can ___ the English test because it is so easy.", "a": "pass", "o": ["drop", "fly", "dry", "pass"], "t": "pass the test ＝ 通過考試。drop 是掉落，fly 是飛，dry 是弄乾。", "lv": 4},
{"n": 14, "c": "單字", "q": "Helen is very ___ and always thinks she's right, even when others don't agree with her.", "a": "proud", "o": ["proud", "close", "top", "clear"], "t": "proud ＝ 驕傲的，這裡指自以為是。close 是靠近，top 是頂端，clear 是清楚的。", "lv": 4},
{"n": 18, "c": "單字", "q": "Kak found his way to the store by using the ___ on his phone.", "a": "map", "o": ["top", "map", "pool", "beak"], "t": "map ＝ 地圖。用手機上的地圖找路。", "lv": 4},
{"n": 19, "c": "單字", "q": "Please ___ the paper on the desk and throw it in the trash can.", "a": "pick up", "o": ["give up", "be proud of", "walk along", "pick up"], "t": "pick up ＝ 撿起來。撿起桌上的紙再丟進垃圾桶。give up 是放棄。", "lv": 4},
{"n": 21, "c": "介系詞／連接詞", "q": "I enjoy taking a cool shower ___ it is very hot.", "a": "when", "o": ["and", "but", "before", "when"], "t": "when ＝ 當…的時候。天氣很熱的時候，我喜歡沖涼。", "lv": 4},
{"n": 24, "c": "介系詞／連接詞", "q": "I help Mom make cookies ___ I wash my hands.", "a": "after", "o": ["because", "before", "after", "when"], "t": "after ＝ 在…之後。洗完手之後才幫忙做餅乾，順序才合理。", "lv": 4},
{"n": 25, "c": "文法", "q": "It was a quarter ___ ten. They ___ about the dance festival in the classroom.", "a": "past; were talking", "o": ["to; are talking", "past; were talking", "不填; talked", "不填; talk"], "t": "a quarter past ten ＝ 10:15（過了 15 分）。句子用 was，所以後面是過去進行式 were + Ving。", "lv": 4},
{"n": 29, "c": "文法", "q": "Sam: I enjoy ___ video games. I always play four hours a day.\nBill: That's a lot of time.", "a": "playing", "o": ["play", "playing", "plays", "to play"], "t": "enjoy 後面接 Ving。enjoy playing。", "lv": 4},
{"n": 31, "c": "文法", "q": "Leon enjoys ___. He ___ a lot in his free time.", "a": "reading; reads", "o": ["read; reading", "reading; read", "to read; reads", "reading; reads"], "t": "enjoy 後面接 Ving：reading。第二格是現在簡單式，He 是第三人稱單數，動詞加 s：reads。", "lv": 4},
{"n": 32, "c": "文法", "q": "Peter was thirsty when he was playing games, so he stopped ___ some water.", "a": "to drink", "o": ["and drink", "drinking", "to drink", "drank"], "t": "stop to V ＝ 停下來去做另一件事（停下來喝水）。stop Ving 是停止做某事，意思不一樣。", "lv": 4},
{"n": 33, "c": "文法", "q": "After Sandy exercises every day, she always ___ a lot of water.", "a": "drinks", "o": ["drinks", "is drinking", "drink", "drank"], "t": "every day、always 表示習慣，用現在簡單式。she 是第三人稱單數，動詞加 s：drinks。", "lv": 4}
];
  var LV = { 1: "基礎關", 2: "進階關", 3: "段考挑戰", 4: "考古題" };
  var LV_INFO = {
    1: "第三課全部單字與片語，加動詞的過去式、Ving，有認字、填空、拼寫",
    2: "單複數、過去式、Ving、時間、介系詞",
    3: "句子選擇題加拼寫，難度接近考卷",
    4: "段考考卷裡屬於第三課的題目"
  };
  // 貼上 Apps Script 網頁應用程式的網址（結尾是 /exec）。留空就不會回傳成績。
  var REPORT_URL = "";
  var TIME_MC = 25, TIME_SP = 40;
  var S = { list: [], i: 0, score: 0, streak: 0, wrong: [], seen: {}, lvs: {}, runName: "", locked: false, timerOn: true, left: 0, limit: 25, tid: null, cur: null };

  var $ = function (id) { return document.getElementById(id); };
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function norm(x) { return String(x).trim().toLowerCase().replace(/\s+/g, " "); }
  function show(id) {
    ["start", "play", "result"].forEach(function (s) { $(s).hidden = s !== id; });
    window.scrollTo(0, 0);
  }

  function buildLevels() {
    var box = $("lvBox");
    box.textContent = "";
    [1, 2, 3, 4, "all"].forEach(function (v, k) {
      var id = "lv" + v;
      var inp = document.createElement("input");
      inp.type = "radio"; inp.name = "level"; inp.id = id; inp.value = v;
      if (k === 0) inp.checked = true;
      var lab = document.createElement("label");
      lab.htmlFor = id;
      var n = v === "all" ? Q.length : Q.filter(function (q) { return q.lv === v; }).length;
      var b = document.createElement("b"); b.textContent = v === "all" ? "全部闖關" : LV[v];
      var s = document.createElement("span"); s.textContent = v === "all" ? "第 1 關到第 4 關依序玩，每關各出你選的題數" : LV_INFO[v];
      var c = document.createElement("em"); c.textContent = "題庫 " + n;
      lab.appendChild(b); lab.appendChild(s); lab.appendChild(c);
      box.appendChild(inp); box.appendChild(lab);
    });
  }

  function selectedLevels() {
    var v = document.querySelector('input[name="level"]:checked').value;
    return v === "all" ? [1, 2, 3, 4] : [parseInt(v, 10)];
  }
  function poolOf(l) { return Q.filter(function (q) { return q.lv === l; }); }
  // 隨機抽題：先讓每個單字各出現一次，題數不夠才補第二題，所以整份單字都有機會輪到
  function sample(part, n, sh) {
    if (!sh) return part.slice(0, n);
    var pool = shuffle(part);
    if (pool.length <= n) return pool;
    var seen = {}, first = [], rest = [];
    pool.forEach(function (q, k) {
      var key = q.wid || ("q" + k);
      if (seen[key]) rest.push(q); else { seen[key] = 1; first.push(q); }
    });
    var out = first.length >= n ? first.slice(0, n) : first.concat(rest.slice(0, n - first.length));
    return shuffle(out);
  }
  function updateNote() {
    var n = parseInt(document.querySelector('input[name="count"]:checked').value, 10);
    var short = selectedLevels().filter(function (l) { return poolOf(l).length < n; })
      .map(function (l) { return LV[l] + "只有 " + poolOf(l).length + " 題"; });
    var el = $("countNote");
    el.hidden = !short.length;
    el.textContent = short.length ? short.join("、") + "，會全部出完。" : "";
  }
  function startFresh() {
    var v = document.querySelector('input[name="level"]:checked').value;
    var sh = $("shuffleOn").checked;
    var n = parseInt(document.querySelector('input[name="count"]:checked').value, 10);
    S.runName = v === "all" ? "全部闖關" : LV[v];
    saveNick();
    var out = [];
    selectedLevels().forEach(function (l) { out = out.concat(sample(poolOf(l), n, sh)); });
    begin(out);
  }
  function getNick() { return $("nick").value.trim().slice(0, 20); }
  function saveNick() { try { localStorage.setItem("l3quiz-nick", getNick()); } catch (e) {} }
  function loadNick() { try { var n = localStorage.getItem("l3quiz-nick"); if (n) $("nick").value = n; } catch (e) {} }
  function reportPayload() {
    var lvs = Object.keys(S.lvs).map(function (k) { return LV[k] + " " + S.lvs[k].ok + "/" + S.lvs[k].n; }).join("；");
    var cats = Object.keys(S.seen).map(function (k) { return k + " " + S.seen[k].ok + "/" + S.seen[k].n; }).join("；");
    var wrong = S.wrong.map(function (w) {
      return label(w.q) + "｜" + plain(w.q) + "｜寫了：" + (w.picked === null ? "沒作答" : w.picked) + "｜答案：" + w.q.a;
    }).join("\n");
    return { name: getNick() || "未填", level: S.runName, score: S.score, total: S.list.length, levels: lvs, cats: cats, wrong: wrong };
  }
  function sendReport() {
    if (!REPORT_URL) return;
    var m = $("sendMsg"), r = $("resendBtn");
    m.hidden = false; r.hidden = true;
    m.textContent = "正在把成績傳給老師……";
    var p;
    try {
      p = fetch(REPORT_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(reportPayload()) });
    } catch (e) { p = Promise.reject(e); }
    p.then(function () { m.textContent = "成績已傳給老師。"; },
      function () { m.textContent = "沒有傳送成功。請按下面的「複製錯題清單」貼給老師，或再傳一次。"; r.hidden = false; });
  }
  function begin(list) {
    S.list = list; S.i = 0; S.score = 0; S.streak = 0; S.wrong = []; S.seen = {}; S.lvs = {};
    S.timerOn = $("timerOn").checked;
    $("timeBar").hidden = !S.timerOn;
    show("play");
    renderQ();
  }
  function pat(q) {
    var out = [];
    for (var i = 0; i < q.a.length; i++) {
      var ch = q.a.charAt(i);
      out.push(ch === " " ? "\u00A0" : (i === 0 && q.p === 1 ? ch : "_"));
    }
    return out.join(" ");
  }
  function renderQ() {
    var q = S.list[S.i], sp = q.k === "spell";
    S.cur = q; S.locked = false;
    $("pi").textContent = S.i + 1;
    $("pn").textContent = S.list.length;
    $("sc").textContent = S.score;
    $("streak").textContent = S.streak;
    $("prog").style.width = (S.i / S.list.length * 100) + "%";
    $("chip").textContent = LV[q.lv] + " · " + q.c + (q.n ? " · 考卷第 " + q.n + " 題" : "");
    var qt = $("qText");
    qt.textContent = "";
    q.q.split("___").forEach(function (part, k, arr) {
      qt.appendChild(document.createTextNode(part));
      if (k < arr.length - 1) { var b = document.createElement("span"); b.className = "blank"; b.innerHTML = "&nbsp;"; qt.appendChild(b); }
    });
    $("qHint").textContent = q.h ? (sp ? "中文：" + q.h : q.h) : "";
    $("qHint").hidden = !q.h;
    $("fb").hidden = true;
    $("opts").hidden = sp;
    $("spell").hidden = !sp;
    var box = $("opts");
    box.textContent = "";
    if (sp) {
      $("pattern").textContent = pat(q);
      var inp = $("spIn");
      inp.value = ""; inp.disabled = false; inp.className = "";
      $("spGo").disabled = false; $("spSkip").disabled = false;
      inp.focus({ preventScroll: true });
    } else {
      shuffle(q.o).forEach(function (o, k) {
        var b = document.createElement("button");
        b.className = "opt"; b.type = "button"; b.dataset.v = o;
        var key = document.createElement("kbd"); key.textContent = k + 1;
        var txt = document.createElement("span"); txt.textContent = o;
        b.appendChild(key); b.appendChild(txt);
        b.addEventListener("click", function () { answer(o); });
        box.appendChild(b);
      });
    }
    startTimer(sp ? TIME_SP : TIME_MC);
  }
  function startTimer(limit) {
    clearInterval(S.tid);
    S.limit = limit; S.left = limit;
    var fill = $("timeFill"), bar = $("timeBar");
    fill.style.width = "100%"; bar.classList.remove("low");
    if (!S.timerOn) return;
    S.tid = setInterval(function () {
      S.left = Math.max(0, S.left - 0.1);
      fill.style.width = (S.left / S.limit * 100) + "%";
      if (S.left <= 5) bar.classList.add("low");
      if (S.left <= 0) { clearInterval(S.tid); answer(null); }
    }, 100);
  }
  function tally(map, key, ok) {
    var st = map[key] || (map[key] = { n: 0, ok: 0 });
    st.n++; if (ok) st.ok++;
  }
  function answer(pick, how) {
    if (S.locked) return;
    S.locked = true;
    clearInterval(S.tid);
    var q = S.cur, sp = q.k === "spell";
    var ok = sp ? (pick !== null && [q.a].concat(q.alt || []).some(function (x) { return norm(pick) === norm(x); })) : pick === q.a;
    if (sp) {
      var inp = $("spIn");
      inp.disabled = true; inp.classList.add(ok ? "ok" : "no");
      $("spGo").disabled = true; $("spSkip").disabled = true;
    } else {
      Array.prototype.forEach.call($("opts").children, function (b) {
        b.disabled = true;
        if (b.dataset.v === q.a) b.classList.add("correct");
        else if (b.dataset.v === pick) b.classList.add("wrong");
      });
    }
    tally(S.seen, q.c, ok);
    tally(S.lvs, q.lv, ok);
    if (ok) { S.score++; S.streak++; }
    else { S.streak = 0; S.wrong.push({ q: q, picked: pick }); }
    $("sc").textContent = S.score;
    $("streak").textContent = S.streak;
    var fb = $("fb");
    fb.className = "fb " + (ok ? "ok" : "no");
    $("fbTitle").textContent = ok ? "答對了！" : (pick === null && how !== "skip" ? "時間到。正確答案是 " : "正確答案是 ") + q.a;
    $("fbTip").textContent = q.t;
    $("nextBtn").textContent = S.i + 1 >= S.list.length ? "看結果" : "下一題";
    fb.hidden = false;
    $("nextBtn").focus();
  }
  function next() {
    S.i++;
    if (S.i >= S.list.length) finish(); else renderQ();
  }
  function plain(q) {
    var t = q.q.replace(/___/g, "____").replace(/\n/g, " ");
    return q.k === "spell" ? t + "（" + q.h + "）" : t;
  }
  function label(q) { return LV[q.lv] + " · " + q.c + (q.n ? " · 考卷第 " + q.n + " 題" : ""); }
  function row(parent, name, s) {
    var r = document.createElement("div"); r.className = "cat";
    var a = document.createElement("span"); a.textContent = name;
    var bar = document.createElement("div"); bar.className = "bar" + (s.ok / s.n < 0.5 ? " weak" : "");
    var i = document.createElement("i"); i.style.width = (s.ok / s.n * 100) + "%"; bar.appendChild(i);
    var c = document.createElement("span"); c.style.textAlign = "right"; c.textContent = s.ok + "/" + s.n;
    r.appendChild(a); r.appendChild(bar); r.appendChild(c); parent.appendChild(r);
  }
  function heading(parent, text) {
    var h = document.createElement("div"); h.className = "sub"; h.textContent = text; parent.appendChild(h);
  }
  function finish() {
    clearInterval(S.tid);
    $("prog").style.width = "100%";
    var total = S.list.length, pct = S.score / total;
    $("rs").textContent = S.score; $("rt").textContent = total;
    $("rmsg").textContent = pct >= 0.8 ? "記得很牢！錯的題目再看一次就更穩了。"
      : pct >= 0.5 ? "已經記得一半以上。看看下面錯的題目，它們就是下次要加強的地方。"
      : "沒關係，這一輪就是用來找出哪裡還不熟。下面的錯題，下次上課先複習它們。";
    var cats = $("cats"); cats.textContent = "";
    var lvKeys = Object.keys(S.lvs);
    if (lvKeys.length > 1) {
      heading(cats, "各關卡");
      lvKeys.forEach(function (k) { row(cats, LV[k], S.lvs[k]); });
    }
    heading(cats, "各類別");
    Object.keys(S.seen).forEach(function (k) { row(cats, k, S.seen[k]); });
    var wl = $("wl"); wl.textContent = "";
    S.wrong.forEach(function (w) {
      var d = document.createElement("div"); d.className = "wi";
      var chip = document.createElement("span"); chip.className = "chip"; chip.textContent = label(w.q);
      var qq = document.createElement("div"); qq.className = "qq"; qq.textContent = plain(w.q);
      var ans = document.createElement("div"); ans.className = "ans";
      if (w.picked !== null) { var s = document.createElement("s"); s.textContent = w.picked; ans.appendChild(s); ans.appendChild(document.createTextNode("　→　")); }
      else ans.appendChild(document.createTextNode("沒作答　→　"));
      var b = document.createElement("b"); b.textContent = w.q.a; ans.appendChild(b);
      var tip = document.createElement("div"); tip.className = "muted"; tip.style.fontSize = "14px"; tip.textContent = w.q.t;
      d.appendChild(chip); d.appendChild(qq); d.appendChild(ans); d.appendChild(tip); wl.appendChild(d);
    });
    var none = S.wrong.length === 0;
    $("wrongCard").hidden = none;
    $("retryBtn").hidden = none;
    $("copyArea").hidden = true;
    show("result");
    $("sendMsg").hidden = true; $("resendBtn").hidden = true;
    sendReport();
  }
  function copyText() {
    var lines = ["Book 3 L3 快問快答：" + S.score + " / " + S.list.length, "", "答錯的題目："];
    S.wrong.forEach(function (w, k) {
      lines.push((k + 1) + ". [" + label(w.q) + "] " + plain(w.q) + " 正確答案：" + w.q.a + (w.picked ? "（寫了或選了 " + w.picked + "）" : "（沒作答）"));
    });
    return lines.join("\n");
  }
  function submitSpell() {
    var v = $("spIn").value;
    if (!v.trim()) { $("spIn").focus(); return; }
    answer(v);
  }

  buildLevels();
  document.addEventListener("change", function (e) {
    if (e.target && (e.target.name === "level" || e.target.name === "count")) updateNote();
  });
  updateNote();
  $("nickBox").hidden = !REPORT_URL;
  loadNick();
  $("resendBtn").addEventListener("click", sendReport);
  $("goBtn").addEventListener("click", startFresh);
  $("nextBtn").addEventListener("click", next);
  $("againBtn").addEventListener("click", function () { show("start"); });
  $("retryBtn").addEventListener("click", function () { S.runName = "練習錯題"; begin(shuffle(S.wrong.map(function (w) { return w.q; }))); });
  $("spGo").addEventListener("click", submitSpell);
  $("spSkip").addEventListener("click", function () { answer(null, "skip"); });
  $("spIn").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); if (!S.locked) submitSpell(); }
  });
  $("copyBtn").addEventListener("click", function () {
    var text = copyText(), area = $("copyArea"), btn = $("copyBtn");
    function fallback() { area.value = text; area.hidden = false; area.focus(); area.select(); }
    try {
      navigator.clipboard.writeText(text).then(function () {
        btn.textContent = "已複製"; setTimeout(function () { btn.textContent = "複製錯題清單"; }, 1800);
      }, fallback);
    } catch (e) { fallback(); }
  });
  document.addEventListener("keydown", function (e) {
    if ($("play").hidden || S.locked || !S.cur || S.cur.k === "spell") return;
    var n = parseInt(e.key, 10);
    if (n >= 1 && n <= 4) {
      var b = $("opts").children[n - 1];
      if (b) answer(b.dataset.v);
    }
  });
})();
</script>
